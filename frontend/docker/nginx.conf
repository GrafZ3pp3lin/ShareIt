# ShareIt SPA static server. Port 8080 to match the nginx-unprivileged image.
# Response headers — HSTS, X-Content-Type-Options, X-Frame-Options,
# Referrer-Policy and the Content-Security-Policy — are Traefik's job, not this
# container's. One owner per header: a second copy here would silently diverge,
# and nginx drops a server-level `add_header` in any location that sets its own anyway.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never leak the nginx version.
    server_tokens off;

    # gzip_static serves pre-compressed files when present; gzip covers the rest.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite bundles are content-addressed: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Runtime env is generated at container start: never cache it.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # The theme bootstrap runs before first paint and carries no content hash, so
    # keep it revalidated: a change must reach clients without stranding them on
    # a stale copy.
    location = /theme.js {
        add_header Cache-Control "no-cache" always;
    }

    # The SPA entry must always be fresh so new releases apply immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback: unknown routes serve index.html (uncached, via the
    # exact-match location above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
