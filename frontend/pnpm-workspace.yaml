# --- Supply chain -------------------------------------------------------------

# Never resolve a version published less than a day ago. Hijacked-token releases
# are typically yanked within hours, so a quarantine window is the cheapest
# protection available. Unit is minutes.
minimumReleaseAge: 1440

# An immature version is not quietly swapped for an older one: pnpm asks in a
# terminal and fails without one. Implied by setting minimumReleaseAge
# explicitly, written out because it is the half that actually bites. It stays
# CI-safe because a fresh version can only enter the lockfile locally, at the
# prompt — CI runs --frozen-lockfile and just re-verifies what was committed.
minimumReleaseAgeStrict: true

# A version whose publish time pnpm cannot determine counts as immature rather
# than being waved through with a warning (that pass is the pnpm default).
minimumReleaseAgeIgnoreMissingTime: false

# Escape hatch for the age gate. `pkg` pins nothing and `pkg@version` pins one
# release; a glob like `@scope/*` is allowed only without a version. pnpm appends
# here when an immature version is approved at the prompt — prune entries once
# the version they name has aged past the cutoff, or the hole stays open.
minimumReleaseAgeExclude:
  - vite@8.3.6

# Reject a version published with weaker credentials than earlier versions of
# the same package had — a package that shipped via npm trusted publishing or
# provenance suddenly releasing from a plain token. That downgrade is the
# signature of a stolen maintainer credential.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# --- Dependency build scripts -------------------------------------------------

# postinstall & friends run only for the packages listed here. Everything else
# is skipped, so a compromised transitive dependency gets no code execution.
allowBuilds:
  esbuild: true

# Fail the install when a dependency wants to build and is not listed above,
# instead of quietly skipping it and leaving a half-working tree. (pnpm default)
strictDepBuilds: true

# Never the blanket "run every dependency's install scripts" mode. (pnpm default)
dangerouslyAllowAllBuilds: false

permissions:
  '@solidjs/web':
    skills: true
  solid-js:
    skills: true
