# Supply-chain hardening for dependency resolution.
#
# The threat model is a hijacked maintainer account publishing a malicious version of a
# package we already trust. Those releases get yanked fast (usually within hours), so the
# cheapest effective defence is refusing to install anything brand new.

# Never resolve a version published less than 2 days ago. Value is in MINUTES (2 * 24 * 60).
# pnpm picks the newest version that satisfies the range AND is old enough, so `pnpm update`
# stays useful -- it just lands you a release or two behind the bleeding edge.
minimumReleaseAge: 2880

# Escape hatch for a release younger than the window -- typically an urgent security fix.
# Add exact `name@version` specs; pnpm also appends here automatically if you confirm a
# too-new package interactively.
#
# Treat entries as temporary. Once a version ages past the window its entry is redundant,
# and a stale list silently exempts those packages from the gate forever. Prune when updating.
minimumReleaseAgeExclude: []

# Fail if a package's publish trust evidence gets *weaker* than what was recorded before
# (e.g. it had a trusted publisher with provenance, and the new release has neither).
# That downgrade is a strong account-hijack signal.
trustPolicy: no-downgrade

# ...but only judge recent releases. Anything published longer ago than this is exempt.
# Value is in MINUTES (14 * 24 * 60). Required here: old transitive pins predate npm
# provenance altogether, so a modern signed release makes them look "downgraded" -- e.g.
# semver@6.3.1 (published 2023) fails the check with no such window. A real hijack shows up
# in a fresh release, which this still catches.
trustPolicyIgnoreAfter: 20160
