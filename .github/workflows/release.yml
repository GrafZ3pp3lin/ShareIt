name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (e.g. 1.0.0), must exceed the latest tag. Empty = compute from commits.'
        required: false
        type: string

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Test the exact commit before creating a tag or building release images
  # ---------------------------------------------------------------------------
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run backend tests
        run: dotnet test backend/kroet.ShareIt.slnx --configuration Release --nologo

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks and tests
        working-directory: frontend
        run: pnpm verify

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Conventional Commits -> next SemVer -> git tag + GitHub Release
  # ---------------------------------------------------------------------------
  version-and-release:
    name: Version and release
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version and create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        # The assignment keeps the script's exit code; `echo "$(...)"` would swallow it.
        run: version="$(bash .github/scripts/version-and-release.sh)" && echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build & push both images to ghcr.io in parallel
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push ${{ matrix.name }}
    needs: version-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shareit-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: shareit-api
            context: ./backend
            dockerfile: ./backend/kroet.ShareIt.Api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io namespaces must be lowercase.
      - name: Normalize image owner
        id: registry
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}
          # stable semver entries auto-emit `latest`; we push it explicitly below.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version-and-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version-and-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Prune old images: keep only the most recent versions per package
  # ---------------------------------------------------------------------------
  cleanup-packages:
    name: Prune ${{ matrix.package }} versions
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - shareit-frontend
          - shareit-api
    steps:
      # Each release pushes two versions ({{version}} and latest). Keeping 3
      # retains the current release plus the previous release's manifest: after
      # being overwritten, its `latest` survives as an untagged version with
      # the same digest.
      - name: Keep only the 3 most recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false
