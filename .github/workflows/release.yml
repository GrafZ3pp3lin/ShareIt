name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (e.g. 1.0.0), must exceed the latest tag. Empty = compute from commits.'
        required: false
        type: string

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Test the exact commit before creating a tag or building release images.
  # The jobs live in ci.yml so pull requests run the identical suite.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Conventional Commits -> next SemVer -> git tag + GitHub Release
  # ---------------------------------------------------------------------------
  version-and-release:
    name: Version and release
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version and create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        # The assignment keeps the script's exit code; `echo "$(...)"` would swallow it.
        run: version="$(bash .github/scripts/version-and-release.sh)" && echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build & push both images to ghcr.io in parallel
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push ${{ matrix.name }}
    needs: version-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shareit-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: shareit-api
            context: ./backend
            dockerfile: ./backend/kroet.ShareIt.Api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io namespaces must be lowercase.
      - name: Normalize image owner
        id: registry
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}
          # stable semver entries auto-emit `latest`; we push it explicitly below.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version-and-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version-and-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Prune old images: keep only the most recent versions per package
  # ---------------------------------------------------------------------------
  cleanup-packages:
    name: Prune ${{ matrix.package }} versions
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - shareit-frontend
          - shareit-api
    steps:
      # Each release pushes two versions ({{version}} and latest). Keeping 3
      # retains the current release plus the previous release's manifest: after
      # being overwritten, its `latest` survives as an untagged version with
      # the same digest.
      - name: Keep only the 3 most recent versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false
