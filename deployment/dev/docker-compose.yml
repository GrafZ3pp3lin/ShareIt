name: kroet.share-it-dev

services:
  share-it-db:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    container_name: share-it-db
    restart: unless-stopped
    environment:
      USERNAME: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
      INIT_SAMPLE_DATA: "false"
    ports:
      - "10260:10260"
      - "9712:9712"
    # volumes:
    #   - shareit_db_data:/data

volumes:
  shareit_db_data:
    external: true